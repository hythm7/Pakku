name: Linux

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - '2025.06'
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Test
        run: prove -e 'raku -I.' --ext .rakutest t
        env:
          PAKKU_TEST_NETWORK: 1
      - name: Add Pakku
        run: raku -I. bin/pakku nobar nospinner verbose all add .
      - name: Add a dist from fez
        run: pakku nobar nospinner verbose all add rak
      - name: Add a dist that lives in REA only
        run: pakku nobar nospinner verbose all add Hash::Merge
      - name: Search, info, state
        run: |
          pakku nobar nospinner search Cro::HTTP
          pakku nobar nospinner info rak
          pakku nobar nospinner state
